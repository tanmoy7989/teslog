[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "teslog"
version = "0.1.0"
description = "Stats dashboard for TeslaMate with route vs odometer analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.0",
    "jinja2>=3.1.4",
    "python-dotenv>=1.0.1",
    "click>=8.1.7",
]

[project.optional-dependencies]
# Only used by scripts/get-tesla-tokens.sh to auto-submit tokens into
# TeslaMate's sign-in page — not needed by the app itself.
auth = ["playwright>=1.40,<2"]
# Only used by tests/ — spins up real ephemeral Postgres containers and a
# real browser to exercise the actual app, not needed to run the app itself.
test = ["pytest>=8", "testcontainers[postgres]>=4.9", "playwright>=1.40,<2"]

[project.scripts]
teslog = "teslog.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
teslog = ["dashboard/**/*"]

[tool.ruff]
line-length = 100
target-version = "py312"
